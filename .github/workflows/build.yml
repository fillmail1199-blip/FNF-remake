name: Generate Native APK
on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java System
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile HTML to Native App via Cordova
        run: |
          npm install -g cordova
          cordova create beatrush com.beatrush.game BeatRush
          cd beatrush
          
          rm -rf www/*
          cp -r ../* www/ || true
          rm -rf www/.git www/.github www/beatrush
          
          cordova platform add android
          
          # Add storage permissions and file-chooser support for Android WebView
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-chooser
          
          # Inject storage permissions into AndroidManifest.xml
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/><\/manifest>/' platforms/android/app/src/main/AndroidManifest.xml
          
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Beat-Rush-APK
          path: beatrush/platforms/android/app/build/outputs/apk/debug/app-debug.apk
