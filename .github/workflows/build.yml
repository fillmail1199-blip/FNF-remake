name: Generate Native APK
on:
  push:
    branches: [ main ]

jobs:
  html-to-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile HTML to APK
        uses: praveshagrawal/HTML-to-APK@main
        with:
          # Sucht nach der index.html im Hauptordner
          app_path: './' 
          # So heißt die App später auf deinem Smartphone-Bildschirm
          app_name: 'Beat-Rush'

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Beat-Rush-Installer
          path: ./*.apk
