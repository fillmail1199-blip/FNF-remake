name: Generate Native APK
on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Cordova
        run: |
          npm install -g cordova@12
          cordova create beatrush com.beatrush.game BeatRush
          cd beatrush

          # Copy only tracked files (avoids node_modules, .git, etc.)
          rm -rf www/*
          git -C .. ls-files -z | while IFS= read -r -d '' f; do
            mkdir -p "www/$(dirname "$f")"
            cp "../$f" "www/$f"
          done
          rm -rf www/.github www/beatrush

          # Add Android platform
          cordova platform add android

          # Add the directory-picker plugin (SAF)
          cordova plugin add @makiwin/cordova-plugin-saf-mediastore

          # Build the debug APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beatrush-apk
          path: beatrush/platforms/android/app/build/outputs/apk/**/*.apk
