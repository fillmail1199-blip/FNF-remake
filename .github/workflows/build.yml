name: Generate Standalone APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Codebase
        uses: actions/checkout@v4

      - name: Compile to Android Package
        uses: jonaswinkler/simple-apk-build@v1
        with:
          # Targets your main front-page folder directory
          source-dir: '.'
          app-name: 'Beat-Rush'
          package-id: 'com.beatrush.game'

      - name: Export Ready APK File
        uses: actions/upload-artifact@v4
        with:
          name: Beat-Rush-Installer
          path: ./*.apk
