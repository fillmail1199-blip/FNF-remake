name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: cordova create beatrush com.beatrush.game BeatRush

      - name: Copy Game Files
        run: |
          cp index.html beatrush/www/
          cp manifest.json beatrush/www/

      - name: Add Android Platform
        run: |
          cd beatrush
          cordova platform add android

      - name: Build APK
        run: |
          cd beatrush
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatRush-APK
          path: beatrush/platforms/android/app/build/outputs/apk/debug/*.apk
